<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stok - BukuKita</title><link rel="stylesheet" href="css/style.css"></head><body data-page="stok">
<header class="top"><span class="logo">📚 BukuKita</span>
<nav aria-label="Menu utama"><a href="dashboard.html">Dashboard</a><a href="stok.html">Stok</a><a href="checkout.html">Pemesanan</a><a href="tracking.html">Tracking</a></nav>
<button class="sec" id="btnLogout" type="button">Keluar</button></header>
<main><section class="card"><h1>Katalog &amp; Stok Buku</h1>
<label for="cari">Cari judul</label><input id="cari" placeholder="Ketik judul buku...">
<div style="overflow-x:auto;margin-top:1rem"><table><thead><tr><th>Kode</th><th>Judul</th><th>Kategori</th><th>Harga</th><th>Stok</th></tr></thead><tbody id="tbStok"></tbody></table></div></section>
<section class="card"><h2>Tambah stok baru</h2><form id="formStok" novalidate><div class="grid">
<div><label for="sKode">Kode</label><input id="sKode"></div><div><label for="sJudul">Judul</label><input id="sJudul"></div>
<div><label for="sKat">Kategori</label><input id="sKat"></div><div><label for="sHarga">Harga (Rp)</label><input type="number" id="sHarga" min="1"></div>
<div><label for="sStok">Stok</label><input type="number" id="sStok" min="0"></div></div>
<div class="err" id="errStok"></div><button type="submit">Tambah baris</button></form></section></main>
<script src="js/data.js"></script><script src="js/script.js"></script></body></html>
